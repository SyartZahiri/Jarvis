[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.3.0"
description = "Local-first, extensible desktop AI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
computer = ["pyautogui>=0.9.54,<1"]
voice = ["vosk>=0.3.45,<1", "sounddevice>=0.5,<1", "pyttsx3>=2.99,<3"]
keyring = ["keyring>=25,<27"]

[project.scripts]
jarvis = "jarvis.cli:main"

[project.gui-scripts]
jarvis-gui = "jarvis.cli:gui_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis = ["web/*", "bundled_skills/*/*", "bundled_skills/*/*/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

