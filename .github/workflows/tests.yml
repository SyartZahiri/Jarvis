name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Check front end and installers
        shell: bash
        run: |
          node --check src/jarvis/web/app.js
          sh -n install.sh
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e) { $e; exit 1 }'
          fi
      - name: Unit tests
        env:
          PYTHONPATH: src${{ runner.os == 'Windows' && ';' || ':' }}tests
        run: python -m unittest discover -s tests -v
